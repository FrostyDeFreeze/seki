<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>%TITLE%</title>
		<meta name="description" content="%DESCRIPTION%" />
		<meta name="theme-color" content="#191724" />
		<meta property="og:title" content="%TITLE%" />
		<meta property="og:description" content="%DESCRIPTION%" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="%URL%" />
		<meta property="og:image" content="%BASE_URL%/assets/img/og.png" />
		<meta property="og:image:width" content="512" />
		<meta property="og:image:height" content="512" />
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="%TITLE%" />
		<meta name="twitter:description" content="%DESCRIPTION%" />
		<meta name="twitter:image" content="%BASE_URL%/assets/img/og.png" />
		<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
		<link rel="stylesheet" href="/assets/css/styles.css" />
	</head>
	<body>
		<div class="center" id="auth-view" hidden>
			<main class="page">
				<header class="bar">
					<img class="logo" src="/assets/img/favicon.svg" alt="Seki" />
					<nav class="actions">
						<a
							class="icon-button"
							href="https://github.com/FrostyDeFreeze/seki"
							target="_blank"
							rel="noopener noreferrer"
							title="GitHub"
							aria-label="GitHub"
						>
							<svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true">
								<path
									d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
								/>
							</svg>
						</a>
					</nav>
				</header>

				<section class="view" aria-label="Sign in">
					<form class="field" id="auth-form" novalidate>
						<input
							id="token-input"
							name="token"
							type="password"
							autocomplete="current-password"
							placeholder="Token"
							aria-label="Token"
							required
						/>
						<button class="button" id="auth-submit" type="submit" title="Sign in" aria-label="Sign in">
							<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
								<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" />
								<path d="m10 17 5-5-5-5" />
								<path d="M15 12H3" />
							</svg>
						</button>
					</form>
					<p class="error" id="auth-error" role="alert"></p>
				</section>
			</main>
		</div>

		<div class="workspace" id="workspace" hidden>
			<header class="bar top">
				<a class="home" href="/" title="Seki" aria-label="Seki">
					<img class="logo" src="/assets/img/favicon.svg" alt="" />
				</a>
				<p class="meta" id="meta"></p>
				<p class="error" id="app-error" role="alert"></p>
				<nav class="actions">
					<button class="icon-button" id="save-button" type="button" title="Save" aria-label="Save">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" />
							<path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" />
							<path d="M7 3v4a1 1 0 0 0 1 1h7" />
						</svg>
					</button>
					<button class="icon-button" id="new-button" type="button" title="New" aria-label="New">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M5 12h14" />
							<path d="M12 5v14" />
						</svg>
					</button>
					<button class="icon-button" id="duplicate-button" type="button" title="Duplicate" aria-label="Duplicate">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
							<path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
						</svg>
					</button>
					<a class="icon-button" id="raw-button" target="_blank" rel="noopener noreferrer" title="Raw" aria-label="Raw">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
							<path d="M14 2v4a2 2 0 0 0 2 2h4" />
							<path d="M10 9H8" />
							<path d="M16 13H8" />
							<path d="M16 17H8" />
						</svg>
					</a>
					<button class="icon-button" id="copy-button" type="button" title="Copy link" aria-label="Copy link">
						<svg class="icon" id="copy-icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
							<path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
						</svg>
						<svg class="icon" id="copied-icon" viewBox="0 0 24 24" aria-hidden="true" hidden>
							<path d="M20 6 9 17l-5-5" />
						</svg>
					</button>
					<button class="icon-button" id="rename-button" type="button" title="Rename" aria-label="Rename">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path
								d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
							/>
							<path d="m15 5 4 4" />
						</svg>
					</button>
					<button class="icon-button danger" id="delete-button" type="button" title="Delete" aria-label="Delete">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M3 6h18" />
							<path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
							<path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
							<path d="M10 11v6" />
							<path d="M14 11v6" />
						</svg>
					</button>
					<a
						class="icon-button"
						id="github-button"
						href="https://github.com/FrostyDeFreeze/seki"
						target="_blank"
						rel="noopener noreferrer"
						title="GitHub"
						aria-label="GitHub"
					>
						<svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true">
							<path
								d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
							/>
						</svg>
					</a>
					<button class="icon-button" id="sign-out-button" type="button" title="Sign out" aria-label="Sign out">
						<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
							<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
							<path d="m16 17 5-5-5-5" />
							<path d="M21 12H9" />
						</svg>
					</button>
				</nav>
				<p class="sr-only" id="copy-status" role="status"></p>
			</header>

			<textarea
				class="editor"
				id="editor"
				spellcheck="false"
				autocomplete="off"
				placeholder="Paste text here"
				aria-label="Paste content"
				hidden
			></textarea>

			<main class="viewer" id="viewer" hidden>
				<div class="code" id="code">
					<pre class="lines" id="lines" aria-hidden="true"></pre>
					<pre class="source"><code id="source"></code></pre>
				</div>
				<article class="markdown" id="markdown" hidden></article>
			</main>
		</div>

		<script src="/assets/js/app.js" defer></script>
	</body>
</html>
